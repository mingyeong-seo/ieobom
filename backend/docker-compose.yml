services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://ieobom:ieobom_password@mysql:3306/ieobom

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ieobom
      MYSQL_USER: ieobom
      MYSQL_PASSWORD: ieobom_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:

